name: OCR security regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  vitest-ocr-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx vitest run tests/security.test.ts
